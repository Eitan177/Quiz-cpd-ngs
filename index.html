<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPenn Clinical Molecular Pathology Trainee Assessment</title>
    <script>
        // Preserve the existing quiz while replacing only Question 1's answer choices.
        const sourceUrl = 'https://raw.githubusercontent.com/Eitan177/Quiz-cpd-ngs/bd56655fad48b255619dcbe4e7f892aa81bbbe27/index.html';
        const updatedOptions = `options: [
                    { text: "Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, Rapid Solid panels for lung, thyroid, and melanoma, plus whole-exome sequencing", isCorrect: false, rationale: "Incorrect. The first portion lists CPD offerings, but whole-exome sequencing is not part of the routine CPD targeted NGS panel menu." },
                    { text: "Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, and Rapid Solid panels for lung, thyroid, and melanoma", isCorrect: true, rationale: "Correct! CPD offers hybrid-capture Solid Tumor and Hematologic panels, a Fusion gene panel, Rapid Heme, and Rapid Solid panels for lung, thyroid, and melanoma." },
                    { text: "Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, Rapid Solid panels for lung, thyroid, and melanoma, plus a clinical RNA-expression profiling panel", isCorrect: false, rationale: "Incorrect. The listed CPD NGS offerings are accurate, but a separate clinical RNA-expression profiling panel is not part of this panel set." },
                    { text: "Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, and Rapid Solid panels for lung, thyroid, and melanoma, with whole-genome sequencing available instead of Rapid Heme", isCorrect: false, rationale: "Incorrect. Rapid Heme is an available CPD assay. Whole-genome sequencing is not offered as a substitute for it in this panel menu." }
                ]`;

        fetch(sourceUrl)
            .then(response => {
                if (!response.ok) throw new Error(`Unable to load quiz source (${response.status})`);
                return response.text();
            })
            .then(html => {
                const optionsPattern = /options:\s*\[[\s\S]*?\n\s*\]\s*(?=\n\s*\},\s*\n\s*\{\s*\n\s*question:)/;
                const updatedHtml = html.replace(optionsPattern, updatedOptions);
                if (updatedHtml === html) throw new Error('Question 1 options could not be located');
                document.open();
                document.write(updatedHtml);
                document.close();
            })
            .catch(error => {
                document.body.innerHTML = `<p style="font-family:sans-serif;padding:2rem;color:#b91c1c">Unable to load the assessment: ${error.message}</p>`;
            });
    </script>
</head>
<body style="background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:2rem">
    Loading assessment…
</body>
</html>
