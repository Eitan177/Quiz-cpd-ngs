<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPenn Clinical Molecular Pathology Trainee Assessment</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col font-sans">
  <header class="w-full py-5 px-8 border-b border-slate-800 bg-slate-950 flex justify-between items-center sticky top-0 z-50">
    <div><h1 class="text-lg font-bold text-white">UPenn Clinical Molecular Pathology Trainee Assessment</h1><p class="text-xs text-slate-400">Core Competency Review Module</p></div>
    <div class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-4 py-1.5 rounded-xl text-xs font-bold">Score: <span id="quiz-score">0</span> / <span id="quiz-total">15</span></div>
  </header>
  <main class="flex-1 max-w-3xl w-full mx-auto p-6 flex flex-col justify-center">
    <div id="quiz-card" class="bg-slate-800/80 border border-slate-700/80 p-8 rounded-3xl shadow-2xl space-y-6">
      <div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider text-indigo-400"><span id="question-progress">Question 1 of 15</span><span>Clinical Genomics</span></div>
      <h2 id="question-text" class="text-xl sm:text-2xl font-extrabold text-white leading-snug">Loading question...</h2>
      <div id="options-container" class="space-y-3"></div>
      <div id="feedback-box" class="hidden p-4 rounded-2xl border text-sm space-y-1"><div id="feedback-title" class="font-bold"></div><div id="feedback-text" class="text-slate-300 text-xs"></div></div>
      <div class="flex justify-between pt-4 border-t border-slate-700"><button onclick="quizApp.prevQuestion()" id="btn-prev" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-semibold disabled:opacity-40" type="button">Previous</button><button onclick="quizApp.nextQuestion()" id="btn-next" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold" type="button">Next</button></div>
    </div>
    <div id="results-card" class="hidden bg-slate-800/80 border border-slate-700/80 p-8 rounded-3xl shadow-2xl space-y-6 text-center max-w-xl mx-auto w-full"><div class="text-5xl">🏆</div><h3 class="text-2xl font-extrabold text-white">Assessment Complete</h3><p id="results-summary" class="text-slate-300 text-sm"></p><button onclick="location.reload()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold mt-4" type="button">Restart Quiz</button></div>
  </main>
  <footer class="py-5 text-center text-xs text-slate-500 border-t border-slate-800">UPenn Clinical Molecular Pathology Trainee Assessment &bull; Standalone Edition</footer>
<script>
const quizData = [
 {question:'What specific Next-Generation Sequencing (NGS) panels are offered at the Center for Personalized Diagnostics (CPD) at UPenn?',options:[
  ['Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, Rapid Solid panels for lung, thyroid, and melanoma, plus whole-exome sequencing',false,'Incorrect. CPD offers a defined set of hybrid-capture and rapid assays; whole-exome sequencing is not the primary panel listed here.'],
  ['Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, and Rapid Solid panels for lung, thyroid, and melanoma',true,'Correct! CPD offers hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, and Rapid Solid panels for lung, thyroid, and melanoma.'],
  ['Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, Rapid Heme, Rapid Solid panels for lung, thyroid, and melanoma, plus a clinical RNA-expression profiling panel',false,'Incorrect. RNA-expression profiling is a separate kind of assay, not one of the listed CPD NGS panels.'],
  ['Hybrid-capture panels for solid tumors and hematologic malignancies, a Fusion gene panel, and Rapid Solid panels for lung, thyroid, and melanoma',false,'Incorrect. Rapid Heme is also an available CPD assay.']
 ]},
 {question:'Which category in our somatic variant interpretation frameworks represents variants linked directly to FDA-approved therapies?',options:[['Tier II - Variants of Potential Clinical Significance',false,'Tier II includes variants with evidence but not necessarily direct FDA-approved therapy linkage.'],['Tier I - Variants with Strong Clinical Significance',true,'Correct! Tier I includes variants linked directly to FDA-approved therapies or guideline-based care.'],['Tier III - Variants of Unknown Significance',false,'Tier III is for variants with uncertain clinical significance.'],['Tier IV - Benign or Likely Benign',false,'Tier IV represents benign or likely benign alterations.']]},
 {question:'With 40% tumor purity, what is the expected approximate VAF for a heterozygous somatic variant present in all tumor cells?',options:[['40%',false,'This is tumor purity, not the expected heterozygous VAF.'],['20%',true,'Correct! With 40% tumor purity and all tumor cells carrying the variant, expected VAF is about 50% of tumor fraction, or roughly 20%.'],['50%',false,'This would be expected if all DNA were tumor-derived and the variant were heterozygous.'],['80%',false,'That would imply nearly all DNA is variant-positive, which is not consistent with 40% purity.']]},
 {question:'How many genes are evaluated in the PennSeq Solid 2.1 versus Heme 2.1 panels?',options:[['Solid: 215; Heme: 202; overlapping genes include TP53, RUNX1, IDH1, IDH2, FLT3, KIT, and ASXL1',true,'Correct! PennSeq Solid 2.1 evaluates 215 genes and Heme 2.1 evaluates 202 genes, with overlap across key genes.'],['Solid: 202; Heme: 215',false,'This reverses the panel sizes.'],['Solid: 45; Heme: 58',false,'Those numbers correspond to smaller rapid panels, not PennSeq 2.1.'],['Solid: 58; Heme: 45',false,'Those numbers are not the PennSeq panel sizes.']]},
 {question:'How many genes are evaluated in TEMP 2.0 versus HEXS 1.0?',options:[['TEMP 215; HEXS 202',false,'Those counts correspond to broader PennSeq panels.'],['TEMP 45; HEXS 58; overlapping genes include ARID1A, KRAS, TMPRSS2, and ALK',true,'Correct! TEMP 2.0 includes 45 genes and HEXS 1.0 includes 58 genes, with overlapping oncogenic targets.'],['TEMP 58; HEXS 45',false,'This reverses the assay sizes.'],['TEMP 202; HEXS 215',false,'Those counts are for PennSeq Solid/Heme, not TEMP/HEXS.']]},
 {question:'What is Tumor Mutational Burden (TMB)?',options:[['The percentage of tumor nuclei in an FFPE slide',false,'That describes tumor cellularity or purity.'],['The number of inherited germline variants per megabase',false,'This is not how TMB is defined.'],['The total number of somatic mutations per megabase of coding DNA',true,'Correct! TMB is the total number of somatic mutations per megabase of coding DNA.'],['The fraction of sequencing reads containing a variant',false,'That is variant allele fraction, not TMB.']]},
 {question:'How does VAF differ between somatic mutations and constitutional SNPs?',options:[['Somatic mutations always have 50% VAF',false,'Somatic VAF varies depending on purity and copy number.'],['There is no difference',false,'Tumor and constitutional variants behave differently.'],['Somatic variants are often subclonal and vary with purity, while constitutional SNPs typically cluster around 50% or 100% in a diploid genome',true,'Correct! Somatic VAF varies by tumor content and clonality, whereas constitutional SNPs usually appear at expected diploid ratios.'],['Constitutional SNPs never appear in the tumor sample',false,'That is not accurate.']]},
 {question:'How do a common germline SNP and an inherited pathogenic cancer-predisposing variant compare?',options:[['A common SNP is usually benign and ≥1% population frequency; a pathogenic predisposition variant is usually rare and clinically actionable',true,'Correct! Common SNPs are often benign and frequent in the population, whereas pathogenic cancer-predisposition variants are typically rare and clinically significant.'],['They are identical concepts',false,'They are not equivalent in frequency and pathogenicity.'],['A pathogenic predisposition variant is always common in the population',false,'That is the opposite of typical disease-causing germline variant frequencies.'],['A common SNP is more likely to be pathogenic than a rare germline variant',false,'This reverses the usual clinical interpretation.']]},
 {question:'Which NGS approach generally requires more input DNA?',options:[['Amplicon assays',false,'Amplicon assays are suited to low-input samples.'],['Hybrid-capture assays, because library preparation often needs more starting DNA than amplicon methods',true,'Correct! Hybrid-capture assays generally require more input DNA than amplicon-based methods.'],['Both require exactly the same amount',false,'Input requirements differ by assay design.'],['Short-read sequencing always uses less DNA regardless of capture chemistry',false,'The chemistry matters more than the read length alone.']]},
 {question:'Do targeted RNA fusion assays require primers or probes for both partner genes?',options:[['Yes, every possible pair must be designed in advance',false,'That would prevent detection of novel partner combinations.'],['No; they usually use anchored or split-read strategies to detect unknown partner genes without predefining every pair',true,'Correct! Targeted RNA fusion assays are designed to detect novel or unknown fusion partners without custom assays for every pair.'],['Only one partner gene needs a primer',false,'Both partners are involved in the fusion event.'],['Only if the sample is FFPE',false,'This is not a requirement tied to sample type.']]},
 {question:'What are the primary functions of OncoKB, gnomAD, ClinVar, and COSMIC?',options:[['OncoKB: population frequencies; gnomAD: therapies; ClinVar: hotspots; COSMIC: pathogenicity',false,'These are mixed up.'],['OncoKB: cancer-specific actionable therapeutic interpretation; gnomAD: population allele frequency; ClinVar: variant interpretation database; COSMIC: catalog of somatic cancer mutations',true,'Correct! These databases serve distinct but complementary roles in cancer genomics.'],['OncoKB: germline disease; gnomAD: somatic mutation catalog; ClinVar: therapy guidance; COSMIC: allele frequencies',false,'This reverses the correct roles.'],['OncoKB: sequencing QC; gnomAD: RNA-fusion database; ClinVar: copy-number analysis; COSMIC: pathology review',false,'These are incorrect database functions.']]},
 {question:'Why must ClinVar entries be interpreted with caution?',options:[['It focuses heavily on germline disease, so a pathogenic classification may not directly establish somatic cancer relevance',true,'Correct! ClinVar is mostly built for germline disease interpretation, so somatic relevance requires careful contextual review.'],['It is not based on real patient data',false,'ClinVar is derived from real submissions and reports.'],['It includes only benign variants',false,'ClinVar includes pathogenic, likely pathogenic, and VUS entries.'],['It is never used in cancer genomics',false,'It can be useful, but context matters.']]},
 {question:'What patterns distinguish mutations in oncogenes from tumor suppressor genes?',options:[['Oncogenes have deletions only and suppressors have one hotspot',false,'This reverses typical patterns.'],['Oncogenes are typically activated by gain-of-function hotspot missense mutations or rearrangements; tumor suppressor genes often show truncating or loss-of-function variants across the gene',true,'Correct! Oncogenes commonly gain activity via hotspot or rearrangement events, while tumor suppressor genes usually lose function through truncating or biallelic events.'],['Oncogenes are always inherited and suppressors are always somatic',false,'Both can be inherited or somatic depending on the gene.'],['Tumor suppressors always mutate at a single hotspot',false,'This is not characteristic of tumor suppressor genes.']]},
 {question:'Do clinical genomics databases incorporate computational variant-effect predictions?',options:[['They are entirely simulated',false,'They rely heavily on real data.'],['Predictions are provided as supplemental evidence but are not typically central to classification',true,'Correct! Computational prediction tools may support interpretation, but clinical databases generally emphasize evidence from multiple sources rather than relying solely on in silico predictions.'],['They ignore all computational tools',false,'Computational predictions are often used as supporting evidence.'],['They only use AI without experimental data',false,'This is not how clinical databases work.']]},
 {question:'Where are canonical splice sites located, and what are their consensus dinucleotides?',options:[['At the exon boundaries, with GT-AG dinucleotides',true,'Correct! Canonical splice donor and acceptor sites are at intron-exon boundaries and typically use GT at the 5′ donor site and AG at the 3′ acceptor site.'],['In the middle of exons, with AT-CG repeats',false,'That describes a different sequence pattern.'],['At the start of introns, with AA-TT dinucleotides',false,'Canonical splice sites are not typically AA-TT.'],['Only in mitochondrial genes, with CT-GA',false,'Canonical splice sites are a general feature of nuclear pre-mRNA splicing.']]}
];
class SimpleQuizEngine{constructor(q){this.questions=q;this.currentIndex=0;this.score=0;this.userAnswers=Array(q.length).fill(null);this.isAnswerChecked=false;document.getElementById('quiz-total').textContent=this.questions.length;this.renderQuestion();}renderQuestion(){const total=this.questions.length;const q=this.questions[this.currentIndex];const opts=q.options;document.getElementById('question-progress').textContent=`Question ${this.currentIndex+1} of ${total}`;document.getElementById('question-text').textContent=q.question;const container=document.getElementById('options-container');container.innerHTML='';opts.forEach((option,idx)=>{const btn=document.createElement('button');btn.type='button';btn.className='w-full text-left p-4 rounded-2xl border border-slate-700 bg-slate-900/60 hover:border-indigo-500 hover:bg-slate-800 transition-all duration-200 text-sm text-slate-100';btn.innerHTML=`<span class="font-semibold text-indigo-300">${String.fromCharCode(65+idx)}.</span> ${option[0]}`;btn.onclick=()=>this.selectAnswer(idx);container.appendChild(btn);});this.updateButtons();this.updateStatus();}selectAnswer(index){if(this.isAnswerChecked)return;this.userAnswers[this.currentIndex]=index;this.isAnswerChecked=true;const q=this.questions[this.currentIndex];const option=q.options[index];const feedbackBox=document.getElementById('feedback-box');const feedbackTitle=document.getElementById('feedback-title');const feedbackText=document.getElementById('feedback-text');feedbackBox.classList.remove('hidden');feedbackTitle.textContent=option[2];feedbackText.textContent=option[1] ? 'Correct answer.' : 'Incorrect answer.';if(option[1])this.score++;this.renderOptionStates();this.updateButtons();}renderOptionStates(){const q=this.questions[this.currentIndex];const selected=this.userAnswers[this.currentIndex];q.options.forEach((option, idx)=>{const btn=document.querySelectorAll('#options-container button')[idx];if(btn){const isCorrect=option[1];const isSelected=selected===idx;btn.classList.remove('border-indigo-500','border-emerald-500','border-red-500','bg-slate-800','bg-emerald-500/10','bg-red-500/10');if(isCorrect){btn.classList.add('border-emerald-500','bg-emerald-500/10');}else if(isSelected){btn.classList.add('border-red-500','bg-red-500/10');}if(isSelected || isCorrect){btn.classList.add('font-semibold');}}});}updateButtons(){const prevBtn=document.getElementById('btn-prev');const nextBtn=document.getElementById('btn-next');prevBtn.disabled=this.currentIndex===0;prevBtn.classList.toggle('opacity-40',this.currentIndex===0);if(this.currentIndex===this.questions.length-1){nextBtn.textContent=this.isAnswerChecked ? 'Finish' : 'Finish';} else {nextBtn.textContent='Next';}if(!this.isAnswerChecked && this.currentIndex===this.questions.length-1){nextBtn.disabled=false;}document.getElementById('quiz-score').textContent=this.score;}prevQuestion(){if(this.currentIndex===0)return;this.currentIndex--;this.isAnswerChecked=false;this.renderQuestion();}nextQuestion(){if(!this.isAnswerChecked){this.selectAnswer(this.userAnswers[this.currentIndex] ?? 0);return;}if(this.currentIndex<this.questions.length-1){this.currentIndex++;this.isAnswerChecked=false;this.renderQuestion();}else{this.showResults();}}showResults(){const quizCard=document.getElementById('quiz-card');const resultsCard=document.getElementById('results-card');quizCard.classList.add('hidden');resultsCard.classList.remove('hidden');const score=this.score;const total=this.questions.length;document.getElementById('results-summary').textContent=`You scored ${score} out of ${total}. ${score===total?'Perfect score!':'Keep reviewing the clinical genomics concepts and try again.'}`;}updateStatus(){const q=this.questions[this.currentIndex];const selected=this.userAnswers[this.currentIndex];const feedbackBox=document.getElementById('feedback-box');if(selected===null){feedbackBox.classList.add('hidden');return;}const selectedOption=q.options[selected];feedbackBox.classList.remove('hidden');document.getElementById('feedback-title').textContent=selectedOption[2];document.getElementById('feedback-text').textContent=selectedOption[1] ? 'Correct answer.' : 'Incorrect answer.';}}const quizApp=new SimpleQuizEngine(quizData);
</script>
</body>
</html>
