<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPenn Clinical Molecular Pathology Trainee Assessment</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .question-card { scroll-margin-top: 90px; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col font-sans">
  <header class="w-full py-5 px-8 border-b border-slate-800 bg-slate-950 flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-lg font-bold text-white">UPenn Clinical Molecular Pathology Trainee Assessment</h1>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-xs uppercase tracking-[0.2em] text-slate-400">Standalone</span>
      <button id="restart-btn" class="rounded-full border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700 transition">Restart</button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-6">
    <div id="quiz-card" class="bg-slate-800/80 border border-slate-700/80 p-8 rounded-3xl shadow-2xl space-y-6">
      <div class="flex items-center justify-between">
        <div class="rounded-full border border-cyan-500/30 bg-cyan-500/10 px-3 py-1 text-sm font-semibold text-cyan-300">Score: <span id="quiz-score">0</span></div>
      </div>
      <div id="question-container" class="space-y-6"></div>
      <div class="flex justify-between items-center border-t border-slate-700 pt-4">
        <button id="prev-btn" class="rounded-full border border-slate-600 bg-slate-800 px-4 py-2 text-sm font-medium text-slate-200 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled>Previous</button>
        <button id="next-btn" class="rounded-full bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-400 transition">Next</button>
      </div>
    </div>
  </main>

  <footer class="py-5 text-center text-xs text-slate-500 border-t border-slate-800">
    UPenn Clinical Molecular Pathology Trainee Assessment &bull; Standalone Edition
  </footer>

  <script>
    const quizData = [
      {
        question: 'What patterns distinguish mutations in oncogenes from tumor suppressor genes?',
        options: [
          ['Oncogenes are often activated by gain-of-function hotspot mutations, whereas tumor suppressor genes are commonly inactivated by loss-of-function alterations', true, 'Correct. Oncogenes frequently show activating hotspot events, while tumor suppressor genes often undergo loss-of-function changes.'],
          ['Oncogenes can sometimes be disrupted by truncating mutations, while some tumor suppressor genes may show amplification-related activation', false, 'Incorrect. This is a mixed pattern and does not reflect the main distinction between oncogene activation and tumor suppressor gene inactivation.'],
          ['Both often show similar variant allele fractions in a given tumor, depending on purity and copy number', false, 'Incorrect. Variant allele fraction can overlap in some cases, but the biological mechanisms of oncogene activation and tumor suppressor loss are not the same.'],
          ['Tumor suppressor genes are often associated with splice-site or truncating variants, while oncogenes may be recognized through hotspot coding changes', false, 'Incorrect. This is a more nuanced explanation, but it still does not capture the core distinction between these gene classes.']
        ]
      }
    ];

    class SimpleQuizEngine {
      constructor(questions) {
        this.questions = questions;
        this.score = 0;
        this.userAnswers = Array(questions.length).fill(null);
        this.quizScore = document.getElementById('quiz-score');
        this.questionContainer = document.getElementById('question-container');
        this.prevBtn = document.getElementById('prev-btn');
        this.nextBtn = document.getElementById('next-btn');
        this.restartBtn = document.getElementById('restart-btn');
        this.currentIndex = 0;
        this.init();
      }

      init() {
        this.prevBtn.addEventListener('click', () => this.showQuestion(this.currentIndex - 1));
        this.nextBtn.addEventListener('click', () => this.handleNext());
        this.restartBtn.addEventListener('click', () => this.restart());
        this.showQuestion(0);
      }

      showQuestion(index) {
        this.currentIndex = index;
        const q = this.questions[index];
        const selected = this.userAnswers[index];

        this.questionContainer.innerHTML = `
          <div class="question-card rounded-2xl border border-slate-700 bg-slate-900/60 p-5">
            <p class="text-sm uppercase tracking-[0.2em] text-cyan-300">Question ${index + 1} of ${this.questions.length}</p>
            <h2 class="mt-3 text-2xl font-bold text-white">${q.question}</h2>
            <div class="mt-5 space-y-3">
              ${q.options.map(([text, isCorrect, feedback], optionIndex) => `
                <label class="block cursor-pointer rounded-xl border ${selected === optionIndex ? 'border-cyan-400 bg-cyan-500/10' : 'border-slate-700 bg-slate-800/60'} p-3 transition hover:border-slate-500">
                  <div class="flex items-start gap-3">
                    <input class="mt-1" type="radio" name="question-${index}" value="${optionIndex}" ${selected === optionIndex ? 'checked' : ''} />
                    <span class="text-slate-100">${text}</span>
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;

        this.questionContainer.querySelectorAll('input[type="radio"]').forEach((input) => {
          input.addEventListener('change', (event) => {
            this.userAnswers[index] = Number(event.target.value);
            this.updateScore();
            this.renderNav();
          });
        });

        this.renderNav();
      }

      renderNav() {
        this.prevBtn.disabled = this.currentIndex === 0;
        this.nextBtn.textContent = this.currentIndex === this.questions.length - 1 ? 'Finish' : 'Next';
      }

      updateScore() {
        let score = 0;
        this.userAnswers.forEach((answer, idx) => {
          if (answer !== null && this.questions[idx].options[answer][1]) score += 1;
        });
        this.score = score;
        this.quizScore.textContent = score;
      }

      handleNext() {
        if (this.userAnswers[this.currentIndex] === null) {
          alert('Please select an answer before continuing.');
          return;
        }

        if (this.currentIndex < this.questions.length - 1) {
          this.showQuestion(this.currentIndex + 1);
        } else {
          this.finishQuiz();
        }
      }

      finishQuiz() {
        const finalScore = this.questions.reduce((total, question, idx) => total + (this.userAnswers[idx] !== null && question.options[this.userAnswers[idx]][1] ? 1 : 0), 0);
        alert(`Quiz complete! Your score is ${finalScore} out of ${this.questions.length}.`);
        this.restart();
      }

      restart() {
        this.score = 0;
        this.userAnswers = Array(this.questions.length).fill(null);
        this.currentIndex = 0;
        this.updateScore();
        this.showQuestion(0);
      }
    }

    new SimpleQuizEngine(quizData);
  </script>
</body>
</html>
